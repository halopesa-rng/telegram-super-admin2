<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connect Bot</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #101820;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 500px;
            margin: 40px auto;
        }

        .card {
            background: #1c2733;
            padding: 25px;
            border-radius: 18px;
        }

        h1 {
            margin-top: 0;
        }

        p {
            line-height: 1.5;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: 0;
            border-radius: 10px;
            background: #168aad;
            color: white;
            font-size: 17px;
            font-weight: bold;
        }

        .warning {
            background: #3b2d13;
            padding: 14px;
            border-radius: 10px;
            margin: 15px 0;
        }

        .error {
            background: #5c1f1f;
            padding: 14px;
            border-radius: 10px;
            margin: 15px 0;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>🤖 Connect Bot</h1>

        <p>
            Unganisha Telegram bot yako kwenye
            Super Admin.
        </p>

        <div class="warning">
            🔐 Bot Token haitatumwa kwenye
            Telegram chat.
        </div>

        {% if error %}
        <div class="error">
            ❌ {{ error }}
        </div>
        {% endif %}

        <form method="POST">

            <label>Jina la Bot</label>

            <input
                type="text"
                name="name"
                placeholder="Mfano: Mikopo Tanzania"
                required
            >

            <label>Telegram Bot Token</label>

            <input
                type="password"
                name="token"
                placeholder="Bot Token kutoka BotFather"
                required
            >

            <button type="submit">
                🔗 CONNECT BOT
            </button>

        </form>

    </div>

</div>

</body>
</html>
